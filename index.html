<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <form id="form1">
        <input type="text" name="username" placeholder="email de login">
        <input type="password" name="password" placeholder="senha">
        <a href="cadastro.html">Fazer cadastro</a>
    </form>
    <form id="form2">
        <input type="text" name="username" id="nome" placeholder="nome de usuario">
        <input type="password" name="password" placeholder="senha">
        <a href="login.html">Fazer Login</a>
    </form>
    <script>
         

        const frmLogin = document.querySelector('#form1')
               
        frmLogin.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmLogin.username.value,
                    "password": frmLogin.password.value
                })
            })

            if (response.status == 404)
                return alert("Usuário não encontrado")

            if (response.status == 401)
                return alert("Senha incorreta")

            if (response.ok) {
                window.location.href = "/home"
                return
            }

            alert("Não deveria chegar aqui")
        }) 
        const frmCadastro = document.querySelector('#form2') 
        frmCadastro.addEventListener('submit', async (ev) => {
            ev.preventDefault()
            const response = await fetch("/user", {
                method: "POST",
                headers: { "Content-type": "application/json" },
                body: JSON.stringify({
                    "username": frmCadastro.username.value,
                    "password": frmCadastro.password.value
                })
            })})

    </script>
</body>

</html>
